class=\"link\"\n            href=\"#personalinfo\"\u003e\u003cspan style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e\u003cspan\n                    data-custom-class=\"body_text\"\u003epersonal information you disclose to us\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan\n            data-custom-class=\"body_text\"\u003e.\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eDo we\n                    process any sensitive personal information? \u003c/strong\u003eSome of the information may be considered \u003cbdt\n                    class=\"block-component\"\u003e\u003c/bdt\u003e'special' or 'sensitive'\u003cbdt class=\"else-block\"\u003e\u003c/bdt\u003e in certain\n                jurisdictions, for example your racial or ethnic origins, sexual orientation, and religious beliefs.\n                \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003eWe do not process sensitive personal information.\u003cbdt\n                    class=\"else-block\"\u003e\u003c/bdt\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eDo we\n                    collect any information from third parties?\u003c/strong\u003e\n                \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003eWe do not collect any information from third parties.\u003cbdt\n                    class=\"else-block\"\u003e\u003c/bdt\u003e\n            \u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eHow do we\n                    process your information?\u003c/strong\u003e We process your information to provide, improve, and administer\n                our Services, communicate with you, for security and fraud prevention, and to comply with law. We may\n                also process your information for other purposes with your consent. We process your information only\n                when we have a valid legal reason to do so. Learn more about \u003c/span\u003e\u003c/span\u003e\u003ca data-custom-class=\"link\"\n            href=\"#infouse\"\u003e\u003cspan style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e\u003cspan\n                    data-custom-class=\"body_text\"\u003ehow we process your information\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan\n            data-custom-class=\"body_text\"\u003e.\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eIn what\n                    situations and with which \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003etypes of \u003cbdt\n                        class=\"statement-end-if-in-editor\"\u003e\u003c/bdt\u003eparties do we share personal information?\u003c/strong\u003e We\n                may share information in specific situations and with specific \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n                categories of \u003cbdt class=\"statement-end-if-in-editor\"\u003e\u003c/bdt\u003ethird parties. Learn more\n                about \u003c/span\u003e\u003c/span\u003e\u003ca data-custom-class=\"link\" href=\"#whoshare\"\u003e\u003cspan\n                style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003ewhen and with whom\n                    we share your personal information\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan\n                data-custom-class=\"body_text\"\u003e.\u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eHow do we\n                    keep your information safe?\u003c/strong\u003e We have adequate \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n                organisational\u003cbdt class=\"else-block\"\u003e\u003c/bdt\u003e and technical processes and procedures in place to protect\n                your personal information. However, no electronic transmission over the internet or information storage\n                technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers,\n                cybercriminals, or other \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003eunauthorised\u003cbdt class=\"else-block\"\u003e\u003c/bdt\u003e\n                third parties will not be able to defeat our security and improperly collect, access, steal, or modify\n                your information. Learn more about \u003c/span\u003e\u003c/span\u003e\u003ca data-custom-class=\"link\" href=\"#infosafe\"\u003e\u003cspan\n                style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003ehow we keep your\n                    information safe\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan data-custom-class=\"body_text\"\u003e.\u003c/span\u003e\u003cspan\n            style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\n                \u003cbdt class=\"statement-end-if-in-editor\"\u003e\u003c/bdt\u003e\n            \u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eWhat are\n                    your rights?\u003c/strong\u003e Depending on where you are located geographically, the applicable privacy law\n                may mean you have certain rights regarding your personal information. Learn more about \u003c/span\u003e\u003c/span\u003e\u003ca\n            data-custom-class=\"link\" href=\"#privacyrights\"\u003e\u003cspan style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e\u003cspan\n                    data-custom-class=\"body_text\"\u003eyour privacy rights\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan\n            data-custom-class=\"body_text\"\u003e.\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003eHow do you\n                    exercise your rights?\u003c/strong\u003e The easiest way to exercise your rights is by \u003cbdt\n                    class=\"block-component\"\u003e\u003c/bdt\u003evisiting \u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\n                    \u003cbdt class=\"question noTranslate\"\u003e\u003ca target=\"_blank\" data-custom-class=\"link\"\n                            href=\"https://www.habitflow.app/settings\"\u003ehttps://www.habitflow.app/settings\u003c/a\u003e\u003c/bdt\u003e\n                \u003c/span\u003e\n                \u003cbdt class=\"else-block\"\u003e\u003c/bdt\u003e, or by contacting us. We will consider and act upon any request in\n                accordance with applicable data protection laws.\n            \u003c/span\u003e "\u003e\u003c/bdt\u003e\n        \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n        \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n        \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n        \u003cbdt class=\"block-component\"\u003e\u003c/span\u003e\u003c/bdt\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003ca data-custom-class=\"link\"\n                href=\"#policyupdates\"\u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e9. DO WE MAKE UPDATES TO THIS\n                    NOTICE?\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003ca data-custom-class=\"link\" href=\"#contact\"\u003e\u003cspan\n                style=\"color: rgb(0, 58, 250); font-size: 15px;\"\u003e10. HOW CAN YOU CONTACT US ABOUT THIS\n                NOTICE?\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003ca data-custom-class=\"link\" href=\"#request\"\u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e11.\n                HOW CAN YOU REVIEW, UPDATE, OR DELETE THE DATA WE COLLECT FROM YOU?\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv id=\"infocollect\" style=\"line-height: 1.5;\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cspan\n                style=\"color: rgb(0, 0, 0); font-size: 15px;\"\u003e\u003cspan style=\"font-size: 15px; color: rgb(0, 0, 0);\"\u003e\u003cspan\n                        style=\"font-size: 15px; color: rgb(0, 0, 0);\"\u003e\u003cspan id=\"control\"\n                            style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e\u003cspan data-custom-class=\"heading_1\"\u003e\n                                    \u003ch2\u003e1. WHAT INFORMATION DO WE COLLECT?\u003c/h2\u003e\n                                \u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan data-custom-class=\"heading_2\"\n            id=\"personalinfo\" style=\"color: rgb(0, 0, 0);\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cstrong\u003e\n                    \u003ch3\u003ePersonal information you disclose to us\u003c/h3\u003e\n                \u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"color: rgb(127, 127, 127);\"\u003e\u003cspan\n                style=\"color: rgb(89, 89, 89); font-size: 15px;\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cspan\n                        style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                            style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                                data-custom-class=\"body_text\"\u003e\u003cstrong\u003e\u003cem\u003eIn\n                                        Short:\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan\n                    data-custom-class=\"body_text\"\u003e\u003cspan style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                            style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                                data-custom-class=\"body_text\"\u003e\u003cstrong\u003e\u003cem\u003e \u003c/em\u003e\u003c/strong\u003e\u003cem\u003eWe collect personal\n                                    information that you provide to us.\u003c/em\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan data-custom-class=\"body_text\"\u003eWe collect personal\n                    information that you voluntarily provide to us when you \u003cspan style=\"font-size: 15px;\"\u003e\n                        \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n                    \u003c/span\u003eregister on the Services, \u003c/span\u003e\u003cspan style=\"font-size: 15px;\"\u003e\u003cspan\n                        data-custom-class=\"body_text\"\u003e\u003cspan style=\"font-size: 15px;\"\u003e\n                            \u003cbdt class=\"statement-end-if-in-editor\"\u003e\u003c/bdt\u003e\n                        \u003c/span\u003e\u003c/span\u003e\u003cspan data-custom-class=\"body_text\"\u003eexpress an interest in obtaining information\n                        about us or our products and Services, when you participate in activities on the Services, or\n                        otherwise when you contact us.\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cbr\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cspan\n                        style=\"font-size: 15px;\"\u003e\n                        \u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n                    \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv style=\"line-height: 1.5;\"\u003e\u003cspan style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan\n                style=\"font-size: 15px; color: rgb(89, 89, 89);\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cstrong\u003ePersonal\n                        Information Provided by You.\u00
