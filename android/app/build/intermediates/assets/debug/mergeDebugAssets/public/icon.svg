<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="outerClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
    <linearGradient id="goldGrad" x1="50" y1="2" x2="50" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2e6c4"/>
      <stop offset="100%" stop-color="#c8954a"/>
    </linearGradient>
  </defs>

  <!-- 1. Dark base (full circle) -->
  <circle cx="50" cy="50" r="48" fill="#111111"/>

  <!-- 2. Gold: right half -->
  <rect x="50" y="2" width="48" height="96" fill="url(#goldGrad)" clip-path="url(#outerClip)"/>

  <!-- 3. Gold: upper small circle (yang head bulging left into yin area) -->
  <circle cx="50" cy="26" r="24" fill="url(#goldGrad)" clip-path="url(#outerClip)"/>

  <!-- 4. Dark: lower small circle (yin head bulging right into yang area) -->
  <circle cx="50" cy="74" r="24" fill="#111111" clip-path="url(#outerClip)"/>

  <!-- 5. Black dot inside gold (upper bump center) -->
  <circle cx="50" cy="26" r="11" fill="#000000"/>

  <!-- 6. Gold dot inside dark (lower bump center) -->
  <circle cx="50" cy="74" r="11" fill="url(#goldGrad)"/>
</svg>
